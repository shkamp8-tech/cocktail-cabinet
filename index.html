<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Cocktail Cabinet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/filters.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/inventory.css">
  <link rel="stylesheet" href="css/canvas.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/scanner.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-diamond">◆</span>
        <h1>The Cocktail Cabinet</h1>
        <span class="logo-diamond">◆</span>
      </div>
      <nav class="main-nav">
        <button class="nav-tab active" data-view="cocktails">Cocktails</button>
        <button class="nav-tab" data-view="inventory">Inventory</button>
        <button class="nav-tab" data-view="add-recipe">Add Recipe</button>
      </nav>
    </div>
  </header>

  <!-- Filter Bar (cocktails view only) -->
  <section id="filter-bar" class="filter-bar">
    <div class="filter-inner">
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search cocktails or ingredients...">
      </div>
      <div class="filter-chips" id="flavor-filters">
        <button class="filter-chip" data-flavor="sour">Sour</button>
        <button class="filter-chip" data-flavor="sweet">Sweet</button>
        <button class="filter-chip" data-flavor="bitter">Bitter</button>
        <button class="filter-chip" data-flavor="herbal">Herbal</button>
        <button class="filter-chip" data-flavor="fruity">Fruity</button>
        <button class="filter-chip" data-flavor="spicy">Spicy</button>
        <button class="filter-chip" data-flavor="creamy">Creamy</button>
        <button class="filter-chip" data-flavor="spirit-forward">Spirit-Forward</button>
        <button class="filter-chip" data-flavor="refreshing">Refreshing</button>
        <button class="filter-chip" data-flavor="tropical">Tropical</button>
      </div>
      <div class="view-toggle-group" id="view-toggle">
        <button class="view-toggle-btn active" data-display="grid" title="Grid">Grid</button>
        <button class="view-toggle-btn" data-display="canvas" title="Taste Map">Taste Map</button>
        <button class="view-toggle-btn" data-display="quiz" title="Find My Drink">Quiz</button>
      </div>
      <div class="filter-selects">
        <select id="strength-filter" class="filter-select">
          <option value="">All Strengths</option>
          <option value="light">Light</option>
          <option value="medium">Medium</option>
          <option value="strong">Strong</option>
          <option value="very-strong">Very Strong</option>
        </select>
        <select id="availability-filter" class="filter-select">
          <option value="">All Availability</option>
          <option value="available">Can Make</option>
          <option value="partial">Almost (1-2 missing)</option>
          <option value="unavailable">Can't Make</option>
        </select>
        <select id="sort-select" class="filter-select">
          <option value="name-asc">Name A-Z</option>
          <option value="name-desc">Name Z-A</option>
          <option value="rating-desc">Highest Rated</option>
          <option value="strength-desc">Strongest First</option>
          <option value="strength-asc">Lightest First</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main id="main-content" class="main-content">
    <!-- Views are rendered here by JS -->
  </main>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-content" id="modal-content">
      <!-- Modal content rendered by JS -->
    </div>
  </div>

  <!-- Data Export/Import in footer -->
  <footer class="app-footer">
    <div class="footer-inner">
      <div class="footer-actions">
        <button id="export-btn" class="footer-btn">Export Data</button>
        <label class="footer-btn import-label">
          Import Data
          <input type="file" id="import-input" accept=".json" hidden>
        </label>
        <button id="api-key-btn" class="footer-btn">🔑 API Key</button>
      </div>
      <div class="footer-deco">
        <span class="deco-line"></span>
        <span class="deco-diamond">◆</span>
        <span class="deco-line"></span>
      </div>
      <p class="footer-text">The Cocktail Cabinet &mdash; Track, Rate & Mix</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data/ingredients.js"></script>
  <script src="js/data/cocktails.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/state.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/availability.js"></script>
  <script src="js/views/cocktailGrid.js"></script>
  <script src="js/views/cocktailCanvas.js"></script>
  <script src="js/views/cocktailQuiz.js"></script>
  <script src="js/views/cocktailDetail.js"></script>
  <script src="js/views/inventory.js"></script>
  <script src="js/login.js"></script>
  <script src="js/views/bottleScanner.js"></script>
  <script src="js/views/addRecipe.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
